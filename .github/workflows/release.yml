name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # ── 产物 1: 传输层插件 ──
          - pkg: zenoh-link-iroh
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: libzenoh_link_iroh.so
          - pkg: zenoh-link-iroh
            os: macos-13
            target: x86_64-apple-darwin
            file: libzenoh_link_iroh.dylib
          - pkg: zenoh-link-iroh
            os: macos-latest
            target: aarch64-apple-darwin
            file: libzenoh_link_iroh.dylib
          - pkg: zenoh-link-iroh
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: zenoh_link_iroh.dll
          # ── 产物 2: 跨语言库 ──
          - pkg: zenoh-over-iroh
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: libzenoh_over_iroh.so
          - pkg: zenoh-over-iroh
            os: macos-13
            target: x86_64-apple-darwin
            file: libzenoh_over_iroh.dylib
          - pkg: zenoh-over-iroh
            os: macos-latest
            target: aarch64-apple-darwin
            file: libzenoh_over_iroh.dylib
          - pkg: zenoh-over-iroh
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: zenoh_over_iroh.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ${{ matrix.pkg }} --target ${{ matrix.target }}
        shell: bash
      - run: |
          mkdir -p release
          src="target/${{ matrix.target }}/release/${{ matrix.file }}"
          echo "Copying: $src"
          cp -v "$src" release/
          ls -la release/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-${{ matrix.target }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          body: |
            ## Zenoh × Iroh v${{ github.ref_name }}

            ### 产物 1: transport plugin → `zenohd -P iroh_link`
            ### 产物 2: cross-language lib → C/Python/Swift/Kotlin/JS
