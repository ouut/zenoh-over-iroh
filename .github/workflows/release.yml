name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 产物 1: 传输层插件 ──
  plugin:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: macos-13
            target: x86_64-apple-darwin
            ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zenoh-link-iroh --target ${{ matrix.target }}
        shell: bash
      - run: |
          mkdir -p release
          if [ "${{ matrix.ext }}" = "dll" ]; then
            copy="cp target/${{ matrix.target }}/release/zenoh_link_iroh.dll release/"
          else
            copy="cp target/${{ matrix.target }}/release/libzenoh_link_iroh.${{ matrix.ext }} release/"
          fi
          eval "$copy"
          ls -la release/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: release/

  # ── 产物 2: 跨语言库 ──
  bindings:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: macos-13
            target: x86_64-apple-darwin
            ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zenoh-over-iroh --target ${{ matrix.target }}
        shell: bash
      - run: |
          mkdir -p release
          base="target/${{ matrix.target }}/release/zenoh_over_iroh"
          if [ "${{ matrix.ext }}" = "dll" ]; then
            cp "${base}.dll" release/
            cp "${base}.lib" release/ 2>/dev/null || true
          else
            cp "${base}.${{ matrix.ext }}" release/
            cp "${base}.a" release/ 2>/dev/null || true
          fi
          ls -la release/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: release/

  # ── Release ──
  release:
    needs: [plugin, bindings]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          body: |
            ## Zenoh × Iroh v${{ github.ref_name }}
            ### 产物 1: 传输层插件 → `zenohd -P iroh_link`
            ### 产物 2: 跨语言库 → C/Python/Swift/Kotlin/JS
