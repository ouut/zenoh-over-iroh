name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# ××××××××××××××××××××××××××××××××××××××××××××
#  产物 1: 传输层插件  编译: make plugin
# ××××××××××××××××××××××××××××××××××××××××××××
jobs:
  plugin:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: macos-13
            target: x86_64-apple-darwin
            ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zenoh-link-iroh --target ${{ matrix.target }}
      - run: |
          mkdir -p release
          if [ "${{ matrix.ext }}" = "dll" ]; then
            cp target/${{ matrix.target }}/release/zenoh_link_iroh.${{ matrix.ext }} release/
          else
            cp target/${{ matrix.target }}/release/libzenoh_link_iroh.${{ matrix.ext }} release/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: release/

  # ××××××××××××××××××××××××××××××××××××××××××××
  #  产物 2: 跨语言完整库  编译: make bindings
  # ××××××××××××××××××××××××××××××××××××××××××××
  bindings:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: macos-13
            target: x86_64-apple-darwin
            ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zenoh-over-iroh --target ${{ matrix.target }}
      - run: |
          mkdir -p release
          BASE="target/${{ matrix.target }}/release/libzenoh_over_iroh"
          if [ "${{ matrix.ext }}" = "dll" ]; then
            cp "target/${{ matrix.target }}/release/zenoh_over_iroh.dll" release/
          else
            cp "${BASE}.${{ matrix.ext }}" release/
            cp "${BASE}.a" release/ 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: release/

  # ××××××××××××××××××××××××××××××××××××××××××××
  #  Release: 合并 → GitHub Release
  # ××××××××××××××××××××××××××××××××××××××××××××
  release:
    needs: [plugin, bindings]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          body: |
            ## Zenoh × Iroh v${{ github.ref_name }}

            ### 产物 1: 传输层插件
            - `libzenoh_link_iroh.so/dylib/dll` → `zenohd -P iroh_link`

            ### 产物 2: 跨语言完整库
            - `libzenoh_over_iroh.so/dylib/dll` + `.a`
            - C / Python / Swift / Kotlin 直接调用

            ```bash
            zenohd -P iroh_link
            # 配置: listen.endpoints = ["iroh/0.0.0.0:0"]
            ```
