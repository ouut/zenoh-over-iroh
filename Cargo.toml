[package]
name = "zenoh-link-state"
version = "0.1.0"
edition = "2021"
description = "Three-state link state machine for zenoh transport plugins — handles QUIC path migration gracefully"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ouut/zenoh-over-iroh"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tracing = "0.1"

[workspace]
members = ["zenoh-link-iroh"]
