[package]
name = "zenoh-link-state"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
description = "Three-state link state machine for zenoh transport plugins — handles QUIC path migration gracefully without disrupting upper-layer protocols"
authors = ["zenoh-link-iroh contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ouut/zenoh-over-iroh"
readme = "README.md"
keywords = ["zenoh", "iroh", "p2p", "quic", "transport"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tracing = "0.1"
