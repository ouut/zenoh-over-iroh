[package]
name = "zenoh-mobile"
version = "0.1.0"
edition = "2021"
description = "Zenoh × Iroh mobile library for iOS and Android"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "zenoh_mobile"

[dependencies]
zenoh = { version = "1", default-features = false, features = ["transport_tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zenoh-link-state = { path = ".." }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
