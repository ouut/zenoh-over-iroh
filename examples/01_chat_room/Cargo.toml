[package]
name = "zenoh-chat-room"
version = "0.1.0"
edition = "2021"
description = "P2P 聊天室 — Iroh QUIC 直连 + LinkStateMachine"

[[bin]]
name = "chat"
path = "src/main.rs"

[dependencies]
iroh = "0.32"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
zenoh-link-state = { path = "../.." }
