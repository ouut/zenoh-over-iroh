[package]
name = "zenoh-link-iroh"
version = "0.1.0"
edition = "2021"
description = "Iroh QUIC P2P transport plugin for Zenoh"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = "0.32"
zenoh = { version = "1", features = [] }
zenoh-plugin-trait = "1"
zenoh-result = "1"
zenoh-link-state = { path = "../zenoh-link-state" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
